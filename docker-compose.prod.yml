services:
  # ============================================================================
  # 1. PostgreSQL Database Service (Internal Only)
  # ============================================================================
  postgres-db:
    image: postgres:17-alpine
    container_name: scoutboard-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scoutboard_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ScoutBoard_Prod_Secure_Pass_2026!}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - scoutboard-network
    # Port 5432 is strictly internal to scoutboard-network; not published to host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-scoutboard_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # 2. Backend API Service (NestJS + TypeORM)
  # ============================================================================
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scoutboard-backend-prod
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-scoutboard_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ScoutBoard_Prod_Secure_Pass_2026!}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ScoutBoard_Prod_Secure_Pass_2026!}@postgres-db:5432/${POSTGRES_DB:-scoutboard_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-ScoutBoard_Prod_JWT_Access_Secret_Key_Super_Secure_2026_Prod!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-ScoutBoard_Prod_JWT_Refresh_Secret_Key_Super_Secure_2026_Prod!}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      THROTTLE_AUTH_LIMIT: ${THROTTLE_AUTH_LIMIT:-10}
      THROTTLE_AUTH_TTL_MS: ${THROTTLE_AUTH_TTL_MS:-60000}
      THROTTLE_QUERY_LIMIT: ${THROTTLE_QUERY_LIMIT:-60}
      THROTTLE_QUERY_TTL_MS: ${THROTTLE_QUERY_TTL_MS:-60000}
      THROTTLE_GLOBAL_LIMIT: ${THROTTLE_GLOBAL_LIMIT:-100}
      THROTTLE_GLOBAL_TTL_MS: ${THROTTLE_GLOBAL_TTL_MS:-60000}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-09b395257421d95a43fa4fd945df43b7}
      API_FOOTBALL_BASE_URL: ${API_FOOTBALL_BASE_URL:-https://v3.football.api-sports.io}
      API_FOOTBALL_TIMEOUT: ${API_FOOTBALL_TIMEOUT:-20000}
      API_FOOTBALL_PROVIDER: ${API_FOOTBALL_PROVIDER:-API_FOOTBALL}
    # Security: Port 3000 is exposed ONLY within the internal Docker network.
    # Ingress routes through Nginx: Internet -> frontend-web:80 -> backend-api:3000
    expose:
      - "3000"
    # Optional diagnostic override for direct backend/Swagger testing:
    # ports:
    #   - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - scoutboard-network

  # ============================================================================
  # 3. Frontend Web Service (React SPA + Nginx Reverse Proxy)
  # ============================================================================
  frontend-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: scoutboard-frontend-prod
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - scoutboard-network

networks:
  scoutboard-network:
    name: scoutboard-prod-network
    driver: bridge

volumes:
  postgres_prod_data:
    name: scoutboard_postgres_prod_data
